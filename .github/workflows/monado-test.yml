name: XR Test Suite

on:
  push:
     branches:
       monado-action-updated
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Run mode'
        required: true
        type: choice
        options:
          - Run_tests
          - Update_README_imgs
        default: Run_tests

env:
  # Push updated screenshots to repo.
  # Selecting 'Update_README_screenshots' option
  # in Actions tab overrides this.
  UPDATE_README_IMGS: true

jobs:
  run-test:
    name: Test Linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      issues: none
      pull-requests: none
      checks: none
      deployments: none
      statuses: none
      packages: none
      pages: none
      repository-projects: none
      discussions: none
      id-token: none
    outputs:
      UPDATE_README_IMGS: ${{ steps.setenv.outputs.UPDATE_README_IMGS }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
  
    - name: Set environment
      id: setenv
      run: >
        if [[ ${{ github.event.inputs.environment}} == "Update_README_imgs" ]]; then
          UPDATE_README_IMGS=true;
        fi
        echo "UPDATE_README_IMGS=${UPDATE_README_IMGS}" >> $GITHUB_OUTPUT
        
    - name: Prepare Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@286ed76c72de45dbf50c515779cf4ca2f6aa3944
      with:
        vulkan-query-version: 1.3.283.0
        vulkan-components: Vulkan-Headers
        vulkan-use-cache: true

    - name: Install dependencies
      run: >
        sudo apt-get update && sudo apt-get install libvulkan-dev libcjson-dev libx264-dev libavcodec-dev libavutil-dev libswscale-dev libavfilter-dev libbsd-dev libavahi-client-dev libeigen3-dev glslang-tools libudev-dev libwayland-dev libx11-xcb-dev libxrandr-dev libxcb-randr0-dev libgl-dev libglx-dev mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev libsystemd-dev libva-dev libxcb-glx0-dev gettext libfontconfig-dev libboost-all-dev librsvg2-bin libssl-dev sway grim mesa-vulkan-drivers wayland-protocols fonts-noto-cjk fonts-roboto

    - name: Cache CMake build directory
      uses: actions/cache@v4
      with:
        path: ${{github.workspace}}/build-monado
        key: ${{ runner.os }}-cmake-build-monado
        restore-keys: |
          ${{ runner.os }}-cmake-build-monado

    - name: Build Monado
      # Disable XRT_FEATURE_OPENXR_VISIBILITY_MASK because of https://gitlab.freedesktop.org/monado/monado/-/issues/480
      run: |
        # Use remotectl driver fork
        # https://gitlab.freedesktop.org/Meumeu/monado/-/commit/5bdb51697685320e3f5d494210f25fb2967c9fc3
        
        # Usage example:
        # https://github.com/WiVRn/WiVRn/blob/ac2044dffc261daf14b16a2df42a24328e38b138/.github/workflows/Build.yml#L209

        mkdir monado
        curl https://gitlab.freedesktop.org/Meumeu/monado/-/archive/5bdb51697685320e3f5d494210f25fb2967c9fc3/monado-main.tar.gz | tar -xz -C monado --strip-components=1

        DRIVERS=$(grep -oE "XRT_BUILD_DRIVER_[A-Z0-9_]*" monado/CMakeLists.txt | sort -u  | grep -v XRT_BUILD_DRIVER_REMOTE | sed 's/\(.*\)/-D\1=OFF/')
        cmake monado -B ${{github.workspace}}/build-monado -DCMAKE_BUILD_TYPE=Release -DXRT_FEATURE_SERVICE_SYSTEMD=OFF -DXRT_FEATURE_SERVICE=OFF -DXRT_BUILD_DRIVER_REMOTE=ON -DXRT_MODULE_COMPOSITOR_MAIN=ON -DXRT_HAVE_WAYLAND=ON $DRIVERS -DXRT_MODULE_MONADO_REMOTECTL=ON -DBUILD_TESTING=OFF -DXRT_FEATURE_OPENXR_VISIBILITY_MASK=OFF

        cmake --build ${{github.workspace}}/build-monado

    - name: Fetch latest game build
      run: |
        curl -sS \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/releases" \
          | jq -r '.[0]' > releases_json.txt
        FILE_URL=$( \
          cat 'releases_json.txt' \
          | jq -r '.assets.[] | select(.name | test("_Linux$")).browser_download_url' \
        )
        echo "Downloading ${FILE_URL}"
        curl -o game.x64 -L --url ${FILE_URL}
        curl -o game.x64 -L https://github.com/V-Sekai/v-sekai-game/releases/download/0.1.0-nightly-2025-07-26T111330-b099fb4_editor-ac70214-rx/v-sekai-game_0.1.0-b099fb4_editor-ac70214_Linux
        chmod +x game.x64
        ls -a .
 
    - name: Take screenshots
      #continue-on-error: true
      env:
        WLR_BACKENDS: headless
        WLR_RENDERER: pixman
        WLR_LIBINPUT_NO_DEVICES: 1
        XR_RUNTIME_JSON: ${{github.workspace}}/build-monado/openxr_monado-dev.json
        P_OVERRIDE_ACTIVE_CONFIG: remote
        XRT_COMPOSITOR_SCALE_PERCENTAGE: '100'
        # Screenshot viewport
        GAME_VIEW_H: 1080
        GAME_VIEW_W: 960
      run: |
        echo "xwayland disable" > sway-config
        echo -e "output HEADLESS-1 {\n mode ${GAME_VIEW_H}x${GAME_VIEW_W}@60Hz\n}" >> sway-config
        sway -c sway-config &
        sleep 10
        export WAYLAND_DISPLAY=$(cd "${XDG_RUNTIME_DIR}" && ls -tr wayland* | tail -1)
        MONADO_CLIENT_PATH="${{github.workspace}}/build-monado/src/xrt/targets/remotectl/monado-remotectl 127.0.0.1 4242 "
       
        ${{github.workspace}}/game.x64 -v &
        GAME_PID=$!
        # Wait game load
        sleep 200

        # Capture
        export OUTPUT_DIR=screenshots
        mkdir -p "${OUTPUT_DIR}"
        ${MONADO_CLIENT_PATH} < ${{github.workspace}}/.github/screenshot-script.txt       

        # Very slow alternative capture (~18min), generates 9 screenshots at set angles
        # chmod +x .github/monado-script-360.sh
        # bash .github/monado-script-360.sh "${MONADO_CLIENT_PATH}" ${GAME_VIEW_W} ${GAME_VIEW_H} 100 "./screenshots-360"

        killall game.x64
        wait $GAME_PID || true
        ls -a .
    
    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      with:
        name: Screenshots
        path: "screenshot*"
  
  upload-screens:
    name: Upload Github
    runs-on: ubuntu-24.04
    needs: run-test
    if: needs.run-test.outputs.UPDATE_README_IMGS == 'true'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clear old screenshots
        run: |
            pwd
            #rm -r screens || true
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Screenshots
          path: screens
      - name: commit
        run: |
            git config --global user.email "github.example@github.com"
            git config --global user.name "github-example"
            git add -A
            git commit -a -m 'Test screen monado'
            git log
            git status
            git push
